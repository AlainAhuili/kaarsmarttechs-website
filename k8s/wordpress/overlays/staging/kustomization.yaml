# WordPress release on staging. Shares the website-staging namespace (created by
# k8s/overlays/staging) because the deploy role may only manage the two website namespaces.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: website-staging
resources:
  - ../../base
labels:
  - pairs: { app.kubernetes.io/environment: staging }
images: # set by the pipeline: kustomize edit set image ...@sha256:<digest>
  - name: ghcr.io/alainahuili/website-wordpress-app
    newTag: latest
  - name: ghcr.io/alainahuili/website-wordpress-api
    newTag: latest
  - name: ghcr.io/alainahuili/website-wordpress-web
    newTag: latest
configMapGenerator:
  - name: wordpress-app
    behavior: merge
    literals:
      - WORDPRESS_URL=https://wp.staging.kaarsmarttechs.com
      - WORDPRESS_ENV=staging
patches:
  - target: { kind: Ingress, name: wordpress }
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: wp.staging.kaarsmarttechs.com
      - op: replace
        path: /spec/rules/0/host
        value: wp.staging.kaarsmarttechs.com
