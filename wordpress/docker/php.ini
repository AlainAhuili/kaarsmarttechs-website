expose_php = Off
memory_limit = 256M
; Media uploads in the editor; the public contact form goes to the API, limited to 64k by nginx.
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 30

; Code is baked into the image and never changes at runtime.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
