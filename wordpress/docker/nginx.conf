# nginx in front of WordPress (PHP-FPM, "app:9000") and the FastAPI service ("api:8000"); the
# hostnames are the service names in docker-compose.yml. Serves static files itself.

# Login attempts per client address. Behind an ingress, configure real_ip so this is per visitor.
limit_req_zone $binary_remote_addr zone=wplogin:1m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;
    server_tokens off;
    absolute_redirect off; # redirects keep the public scheme/host behind the ingress
    client_max_body_size 16m; # media uploads in the editor; /api/ allows far less

    # Security headers, shared with the Astro image.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness/readiness probe for nginx itself. /api/health checks the API and its database.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- FastAPI: project data and the contact form.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k; # the contact form is the only request with a body
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        # The API counts X-Forwarded-For entries from the right (TRUSTED_PROXY_HOPS), so entries
        # a client sends itself cannot hide its address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static files.
    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /wp-content/uploads/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- WordPress admin: looser CSP, never cached or indexed.
    location /wp-admin/ {
        include /etc/nginx/snippets/admin-headers.conf;
        try_files $uri $uri/ =404;
    }

    location = /wp-login.php {
        include /etc/nginx/snippets/admin-headers.conf;
        limit_req zone=wplogin burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/fastcgi-wordpress.conf;
    }

    location ~ ^/wp-admin/.+\.php$ {
        include /etc/nginx/snippets/admin-headers.conf;
        include /etc/nginx/snippets/fastcgi-wordpress.conf;
    }

    # ---- Public pages: everything that is not a file is routed by WordPress.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location = /index.php {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/fastcgi-wordpress.conf;
    }

    # No other PHP file is reachable: not xmlrpc.php, wp-cron.php, uploads or theme files.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
