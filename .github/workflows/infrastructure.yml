# Infrastructure as code checks. Applying changes is a deliberate, manual step by an operator.
name: infrastructure

on:
  pull_request:
    paths: ["infra/**", "k8s/**"]
  push:
    branches: [main]
    paths: ["infra/**", "k8s/**"]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  kubernetes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.4.3"
      - name: Render overlays and validate against the Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for overlay in k8s/overlays/staging k8s/wordpress/overlays/staging k8s/wordpress/overlays/production; do
            kustomize build "$overlay" | ./kubeconform -strict -summary -kubernetes-version 1.31.0
          done
