# Continuous delivery pipeline for kaarsmarttechs.com
#
#   commit stage ─▶ package & scan ─▶ staging (auto) ─▶ production (manual approval)
#
# Pull requests run the commit stage only. Every push to main produces one immutable image
# (tagged with the commit SHA, deployed by digest) that is promoted unchanged through environments.
name: delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alainahuili/website # registry paths must be lowercase

jobs:
  # ---------------------------------------------------------------- commit stage
  verify:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Post-build quality gate (links, SEO, legal pages, CSP, GDPR)
        run: npm run test:dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7

  # ---------------------------------------------------------- package and scan
  image:
    name: Build, scan, push image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha

  # ------------------------------------------------------------------- staging
  staging:
    name: Deploy to staging
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      url: https://staging.kaarsmarttechs.com
      image: ${{ needs.image.outputs.ref }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # ---------------------------------------------------------------- production
  # The "production" GitHub environment has required reviewers, so this job waits
  # for a human approval: continuous delivery, not continuous deployment.
  production:
    name: Deploy to production
    needs: [image, staging]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      url: https://kaarsmarttechs.com
      image: ${{ needs.image.outputs.ref }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
