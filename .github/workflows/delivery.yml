# Continuous delivery pipeline for the Astro site
#
#   commit stage ─▶ package & scan ─▶ staging (auto)
#                                  └─▶ Cloud Run test, environment cloud_production (auto)
#
# Production (kaarsmarttechs.com) runs the WordPress release, deployed by wordpress.yml; the Astro
# site stays on staging.kaarsmarttechs.com.
#
# Pull requests run the commit stage only. Every push to main produces one immutable image
# (tagged with the commit SHA, deployed by digest) that is promoted unchanged through environments.
name: delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/alainahuili/website # registry paths must be lowercase

jobs:
  # ---------------------------------------------------------------- commit stage
  verify:
    name: Lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint and type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Post-build quality gate (links, SEO, legal pages, CSP, GDPR)
        run: npm run test:dist
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7

  # ---------------------------------------------------------- package and scan
  image:
    name: Build, scan, push image
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability scan (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha

  # ------------------------------------------------------------------- staging
  staging:
    name: Deploy to staging
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      url: https://staging.kaarsmarttechs.com
      image: ${{ needs.image.outputs.ref }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  # ------------------------------------------------------ Google Cloud Run (test)
  # The blueprint "nginx reverse proxy in front of an API container" on Cloud Run: one service with
  # the scanned web image (nginx, ingress) and the FastAPI image beside it, described in
  # infra/cloudrun/service.yaml. Cloud Run provides DNS, TLS and the load balancer.
  # Logs in through Workload Identity Federation: only jobs in this repo's cloud_production
  # environment (main branch only) may act as the github-deployer service account, so no key is
  # stored. Settings are environment variables.
  cloud_production:
    name: Deploy to Cloud Run
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: cloud_production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: |
          docker build -f wordpress/Dockerfile --target api \
            --build-arg VERSION=${{ github.sha }} -t "$REGISTRY/kaarsmarttechs-api:sha-${{ github.sha }}" .
      - name: Vulnerability scan of the API image (fails on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/kaarsmarttechs-api:sha-${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push both images to Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          web="$REGISTRY/${{ vars.CLOUD_RUN_SERVICE }}:sha-${{ github.sha }}"
          docker pull "${{ needs.image.outputs.ref }}"
          docker tag "${{ needs.image.outputs.ref }}" "$web"
          docker push "$web"
          docker push "$REGISTRY/kaarsmarttechs-api:sha-${{ github.sha }}"
          echo "WEB_IMAGE=$web" >> "$GITHUB_ENV"
          echo "API_IMAGE=$REGISTRY/kaarsmarttechs-api:sha-${{ github.sha }}" >> "$GITHUB_ENV"
      - name: Deploy
        id: deploy
        run: |
          API_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$API_SECRET"
          export API_SECRET
          envsubst '${WEB_IMAGE} ${API_IMAGE} ${API_SECRET}' < infra/cloudrun/service.yaml > "$RUNNER_TEMP/service.yaml"
          gcloud run services replace "$RUNNER_TEMP/service.yaml" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}"
          rm "$RUNNER_TEMP/service.yaml"
          url=$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for path in / /de/ /fr/ /api/projects; do
            curl -fsS -o /dev/null "$url$path"
          done
          test "$(curl -fsS "$url/version.txt")" = "${{ github.sha }}"
          curl -fsS "$url/api/health" | grep -q '"version":"${{ github.sha }}"'
