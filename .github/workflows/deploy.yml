# Reusable deployment: apply the Kustomize overlay with an immutable image, wait for the
# rollout, smoke-test the live URL and roll back automatically if anything fails.
name: deploy

on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      url: { required: true, type: string }
      image: { required: true, type: string, description: "image@sha256:digest" }

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name kst-platform --region eu-central-1

      - uses: imranismail/setup-kustomize@v3
        with:
          kustomize-version: "5.4.3"

      - name: Pin image digest
        working-directory: k8s/overlays/${{ inputs.environment }}
        run: kustomize edit set image ghcr.io/kaarsmarttechs/website=${{ inputs.image }}

      - name: Apply manifests
        id: apply
        run: kustomize build k8s/overlays/${{ inputs.environment }} | kubectl apply -f -

      - name: Wait for rollout
        run: kubectl -n website-${{ inputs.environment }} rollout status deployment/website --timeout=180s

      - name: Smoke test
        run: ./scripts/smoke-test.sh "${{ inputs.url }}" "${{ github.sha }}"

      - name: Roll back on failure
        # only when something reached the cluster; an earlier failure leaves nothing to undo
        if: failure() && steps.apply.outcome != 'skipped'
        run: |
          kubectl -n website-${{ inputs.environment }} rollout undo deployment/website
          kubectl -n website-${{ inputs.environment }} rollout status deployment/website --timeout=180s
