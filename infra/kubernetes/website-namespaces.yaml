# Namespaces of the website. Cluster-scoped, while the GitHub deploy role may only act inside them
# (see the access entry in infra/terraform/main.tf), so an operator creates them once:
#
#   kubectl apply -f infra/kubernetes/website-namespaces.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: website-staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: website-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
