server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off; # redirects keep the public scheme/host behind the ingress

    # Security headers. No third-party origins are needed: fonts and scripts are self-hosted.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Liveness/readiness probe for Kubernetes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Reverse proxy to the FastAPI backend (wordpress/api). It runs next to nginx in the same pod or
    # Cloud Run service and listens on localhost only; without it, /api/ answers 502.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 64k; # the contact form is the only request with a body
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The API counts X-Forwarded-For entries from the right (TRUSTED_PROXY_HOPS), so entries
        # a client sends itself cannot hide its address.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Fingerprinted build assets can be cached forever.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
