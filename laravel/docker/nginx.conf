# nginx in front of the Laravel app: serves public/ directly and passes everything else to
# PHP-FPM. "app" is the PHP-FPM container's hostname (the service name in docker-compose.yml).
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    server_tokens off;
    absolute_redirect off; # redirects keep the public scheme/host behind the ingress
    client_max_body_size 64k; # the contact form is the only request with a body

    # Security headers, shared with the Astro image.
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Liveness/readiness probe for nginx itself. /up checks the app through PHP-FPM.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /fonts/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300";
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include /etc/nginx/snippets/security-headers.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass app:9000;
    }

    # No other PHP file is reachable.
    location ~ \.php$ {
        return 404;
    }
}
